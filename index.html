<style>
:root{--o:#f28c18;--d:#7b4318;--c:#fffaf2}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;background:linear-gradient(#fffaf2,#fff);color:var(--d)}
header{background:#fff;border-bottom:5px solid var(--o);padding:12px}.brand{max-width:900px;margin:auto;display:flex;align-items:center;gap:12px}.brand img{width:78px;height:78px;object-fit:contain}.brand b{font-size:18px}.brand h1{margin:2px 0;color:#c96300;font-size:clamp(28px,7vw,48px)}

.note{text-align:center;margin-top:30px;background:#fff2dd;padding:15px;border-radius:18px;font-weight:700}footer{text-align:center;padding:20px;font-weight:900}
@media(max-width:520px){.brand img{width:64px;height:64px}.brand b{font-size:14px}.grid{gap:10px}.card{min-height:112px}}

type="application/json">[["mx+my+mz", "m(x+y+z)", "共通因数 m をくくり出す。"], ["15x^2y-5xy", "5xy(3x-1)", "共通因数 5xy をくくり出す。"], ["-30ab+6a-9b", "-3(10ab-2a+3b)", "共通因数 −３ をくくり出す。−30ab÷(−３)＝10ab、６a÷(−３)＝−２a、−９b÷(−３)＝３b。"], ["x^2-25", "(x-5)(x+5)", "２乗の差：A²−B²＝(A−B)(A＋B)。"], ["36a^2-4b^2", "4(3a-b)(3a+b)", "まず４でくくる。その後、２乗の差を使う。"], ["x^2+8x+7", "(x+1)(x+7)", "積が７、和が８になる２数は１と７。"], ["x^2-2x-48", "(x-8)(x+6)", "積が−48、和が−２になる２数は−８と６。"], ["x^2-16x+64", "(x-8)^2", "完全平方：x²−２×８×x＋８²。"], ["9x^2-30xy+25y^2", "(3x-5y)^2", "(3x)²−２×3x×5y＋(5y)²。"], ["(a+b)^2-25", "(a+b-5)(a+b+5)", "a＋b をひとまとまりにして、２乗の差を使う。"], ["(x-y)^2+2(x-y)-35", "(x-y+7)(x-y-5)", "x−y を A とおく。A²＋２A−35＝(A＋７)(A−５)。"], ["16ax^2-24ax+9a", "a(4x-3)^2", "まず a をくくる。かっこの中は完全平方。"], ["ax-ay+bx-by", "(a+b)(x-y)", "a(x−y)＋b(x−y) とまとめ、共通因数 x−y をくくる。"], ["x^2+4x+4-y^2", "(x+2-y)(x+2+y)", "はじめの３項を (x＋２)² にまとめ、２乗の差を使う。"], ["x^2-y^2-4y-4", "(x-y-2)(x+y+2)", "x²−(y＋２)² とまとめ、２乗の差の公式で因数分解する。"]]</script><script>
'use strict';const data=JSON.parse(document.getElementById('data').textContent),$=id=>document.getElementById(id);let mode='original',order=data.map((_,i)=>i),index=0,revealed=false,marks={};try{marks=JSON.parse(localStorage.getItem('mugen-factor15-swapped-v1')||'{}')}catch{}function save(){try{localStorage.setItem('mugen-factor15-swapped-v1',JSON.stringify(marks))}catch{}}function key(i){return mode+':'+i}function question(i){return {q:data[i][0],a:data[i][1],note:data[i][2],changed:false}}
function math(s){const ns='http://www.w3.org/1998/Math/MathML',make=(tag,t)=>{const n=document.createElementNS(ns,tag);if(t!==undefined)n.textContent=t;return n},root=make('math'),tokens=s.match(/\d+|[a-z]|\^2|[^\s]/g)||[];let pos=0;root.setAttribute('aria-label',s.replaceAll('^2','の２乗'));function sequence(){const row=make('mrow');while(pos<tokens.length&&tokens[pos]!==')'){const t=tokens[pos++];let atom;if(t==='('){atom=make('mrow');const left=make('mo','(');left.setAttribute('fence','true');left.setAttribute('stretchy','true');left.setAttribute('symmetric','true');const inner=sequence();if(tokens[pos]!==')')throw Error('括弧が対応していません');pos++;const right=make('mo',')');right.setAttribute('fence','true');right.setAttribute('stretchy','true');right.setAttribute('symmetric','true');atom.append(left,inner,right)}else{atom=make(/^[a-z]$/.test(t)?'mi':/^\d+$/.test(t)?'mn':'mo',t==='-'?'−':t)}if(tokens[pos]==='^2'){pos++;const sup=make('msup');sup.append(atom,make('mn','2'));atom=sup}row.append(atom)}return row}root.append(sequence());if(pos!==tokens.length)throw Error('括弧が対応していません');return root}

function stopAudio(){if('speechSynthesis'in window)speechSynthesis.cancel()}function show(){const i=order[index],c=i===undefined?null:question(i);$('label').textContent=revealed?'答え・ポイント':'問題';$('flip').textContent=revealed?'問題に戻る':'答えを見る';$('badge').textContent=c?'No.'+(i+1)+(c.changed?' · 類題':''):'';$('formula').replaceChildren();$('note').textContent='';if(c){if(revealed&&!c.a){const t=document.createElement('span');t.className='answer-text';t.textContent='整数係数では因数分解できません';$('formula').append(t)}else $('formula').append(math(revealed?c.a:c.q));$('formula').className='formula'+((revealed?c.a||'':c.q).length>16?' long':'');$('note').textContent=revealed?c.note:(c.changed?'原文の数値を変更した練習問題です。':'次の式を因数分解しよう。')}else $('formula').textContent='復習する問題はありません';$('prev').disabled=index<=0;$('next').disabled=index>=order.length-1;['flip','known','review','speak'].forEach(id=>$(id).disabled=!c);$('stats').textContent=(c?(index+1)+' / '+order.length+' 問':'０問')+'　○ '+data.filter((_,j)=>marks[key(j)]==='known').length+'　△ '+data.filter((_,j)=>marks[key(j)]==='review').length;$('fill').style.width=(c?(index+1)/order.length*100:0)+'%';$('grid').replaceChildren();for(const j of order){const b=document.createElement('button');b.textContent=j+1;b.className=(j===i?'active ':'')+(marks[key(j)]||'');b.setAttribute('aria-label','第'+(j+1)+'問');b.onclick=()=>{index=order.indexOf(j);revealed=false;stopAudio();show()};$('grid').append(b)}$('original').classList.toggle('active',mode==='original');$('practice').classList.toggle('active',mode==='practice');$('sourceNotice').textContent=mode==='original'?'写真の原文15問です。⑦・⑮は整数係数では因数分解できません。練習版では、この２問を類題に差し替えます。':'全15問が因数分解できる練習版です。⑦の−56を−48へ、⑮の−１を−４へ変更。ほかの13問は原文どおりです。'}function speak(){if(!('speechSynthesis'in window)||!order.length)return;stopAudio();const c=question(order[index]),u=new SpeechSynthesisUtterance(c.note);u.lang='ja-JP';u.rate=Number($('speed').value);speechSynthesis.speak(u)}function flip(){if(!order.length)return;revealed=!revealed;stopAudio();show();if(revealed&&$('autoAudio').checked)speak()}function move(n){if(!order.length)return;index=Math.max(0,Math.min(order.length-1,index+n));revealed=false;stopAudio();show()}function setMode(m){mode=m;order=data.map((_,i)=>i);index=0;revealed=false;stopAudio();show()}$('flip').onclick=flip;$('card').onclick=flip;$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);$('original').onclick=()=>setMode('original');$('practice').onclick=()=>setMode('practice');$('speak').onclick=speak;['known','review'].forEach(type=>$(type).onclick=()=>{if(!order.length)return;marks[key(order[index])]=type;save();move(1)});$('all').onclick=()=>{order=data.map((_,i)=>i);index=0;revealed=false;stopAudio();show()};$('ordered').onclick=()=>{order.sort((a,b)=>a-b);index=0;revealed=false;stopAudio();show()};$('onlyReview').onclick=()=>{order=data.map((_,i)=>i).filter(i=>marks[key(i)]==='review');index=0;revealed=false;stopAudio();show()};$('shuffle').onclick=()=>{for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}index=0;revealed=false;stopAudio();show()};let sx=0,sy=0,swipe=false;$('card').addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY;swipe=false});$('card').addEventListener('pointerup',e=>{const dx=e.clientX-sx,dy=e.clientY-sy;if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.4){swipe=true;move(dx<0?1:-1)}});$('card').addEventListener('click',e=>{if(swipe){e.stopImmediatePropagation();swipe=false}},true);$('card').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();flip()}};document.addEventListener('keydown',e=>{if(e.target.matches('button,input,select'))return;if(e.key==='ArrowRight')move(1);if(e.key==='ArrowLeft')move(-1)});if(!('speechSynthesis'in window)){['autoAudio','speed','speak'].forEach(id=>$(id).disabled=true)}show();

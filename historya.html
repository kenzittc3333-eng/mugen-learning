<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;background:linear-gradient(#ff8500,#ffc54c 24%,#fff7e6);color:#2b180f}
header{padding:8px;background:linear-gradient(145deg,#ff7200,#ffb426);border-bottom:3px solid #fff0ad}
.head{max-width:980px;margin:auto;position:relative;min-height:205px;border-radius:26px;overflow:hidden;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 55% 30%,#ffde7f 0,transparent 48%)}
.hero{position:absolute;left:3px;bottom:0;width:155px;height:185px;object-fit:contain}.title{position:relative;text-align:center;width:100%;padding:0 35px 0 140px}
.brand{display:inline-block;background:#fff;border-radius:999px;padding:7px 18px;color:#ed5700;font-weight:900}h1{margin:10px 0 0;font-size:clamp(27px,6vw,50px);color:#fff;text-shadow:0 4px 0 #9b3400}
.sub{display:inline-block;margin-top:12px;padding:7px 18px;border-radius:9px;background:#e94d00;color:#fff;font-weight:900}
.controls{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:980px;margin:12px auto 0}button{border:0;border-radius:18px;padding:11px 5px;font-weight:900;color:#fff;background:linear-gradient(#ff8b00,#f35400);box-shadow:0 4px 0 #a63800}button.gold{background:linear-gradient(#ffc832,#ff9700)}button.green{background:linear-gradient(#67b972,#3f8f58);box-shadow:0 4px 0 #2b6840}button.active{outline:4px solid #fff5a7}
main{max-width:980px;margin:auto;padding:12px 10px 26px}.stage{background:#fffaf4;border:3px solid #ff7200;border-radius:26px;padding:12px}
.card{position:relative;min-height:410px;border:2px solid #ff7a00;border-radius:23px;background:linear-gradient(160deg,#fff,#fffaf3);padding:72px 20px 78px;display:flex;align-items:center;justify-content:center;text-align:center;overflow:hidden;touch-action:pan-y}
.badge{position:absolute;top:0;left:22px;width:100px;padding:11px 7px 23px;background:linear-gradient(#ff8200,#f04c00);color:#fff;font-weight:900;font-size:18px;border-radius:0 0 25px 25px}
.label{position:absolute;top:22px;left:50%;transform:translateX(-50%);padding:7px 24px;border-radius:17px;background:linear-gradient(#ff8700,#ff6200);color:#fff;font-size:19px;font-weight:900}
.content{width:100%;display:flex;flex-direction:column;align-items:center;gap:16px}.question{font-size:clamp(28px,5.8vw,50px);font-weight:1000;line-height:1.3}.answer{font-size:clamp(36px,7.4vw,62px);font-weight:1000;color:#e65300;line-height:1.2}.catline{font-size:clamp(16px,3vw,23px);font-weight:900;color:#a44b00}
.mascot{position:absolute;right:6px;bottom:0;width:100px;height:100px;object-fit:contain}.hint{position:absolute;bottom:20px;left:18px;right:110px;color:#ef5b00;font-weight:900;font-size:13px}
.progress{margin:12px 0 6px;background:#fffaf2;padding:11px 16px;border-radius:22px;border:2px solid #ffc065}.pt{text-align:center;color:#d64b00;font-weight:900;font-size:20px;margin-bottom:8px}
.bar{height:13px;background:#fff;border:1px solid #d8a97b;border-radius:99px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#ff9800,#ff5b00)}.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;margin-top:11px}.num{background:#fff;color:#4b2414;border:1px solid #ffae49;border-radius:10px;padding:8px 2px;box-shadow:none;font-size:13px}.num.active{background:#ff5f00;color:#fff;outline:2px solid #ffb23c}

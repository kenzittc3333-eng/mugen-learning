<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>英語 不規則動詞フラッシュカード100｜なんこうくん オレンジ版</title>
<style>
:root {
  --orange:#f57c00;
  --orange2:#ff9800;
  --orange3:#ffb74d;
  --cream:#fff7ed;
  --brown:#6d3b16;
  --line:#ffd0a0;
  --shadow:0 14px 40px rgba(175,86,0,.18);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:"Noto Sans JP","Yu Gothic","Hiragino Kaku Gothic ProN",system-ui,sans-serif;background:
radial-gradient(circle at 12% 5%,#fff7df 0 13%,transparent 35%),
linear-gradient(160deg,#fffaf3,#fff0dd);color:#25180f}
body{min-height:100vh;display:flex;justify-content:center;padding:18px}
.app{width:min(100%,1080px);min-height:calc(100vh - 36px);display:flex;flex-direction:column;gap:14px}
.header{
  background:linear-gradient(135deg,#ff6d00,#ff9800 55%,#ffb300);
  color:white;border-radius:28px;padding:18px 22px;box-shadow:var(--shadow);
  display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center
}
.badge,.counter{background:white;color:#ef6c00;border-radius:18px;padding:10px 16px;font-weight:900;white-space:nowrap}
.title{text-align:center;font-size:clamp(22px,4vw,42px);font-weight:1000;letter-spacing:.03em;text-shadow:0 2px 0 rgba(0,0,0,.08)}
.stage{flex:1;perspective:1600px}
.card{
  width:100%;height:clamp(520px,72vh,780px);position:relative;transform-style:preserve-3d;
  transition:transform .55s cubic-bezier(.2,.75,.2,1);cursor:pointer;touch-action:pan-y;
}
.card.flipped{transform:rotateY(180deg)}
.face{
  position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  border:5px solid #ff9800;border-radius:36px;background:white;box-shadow:var(--shadow);
  overflow:hidden;display:flex;flex-direction:column;
}
.back{transform:rotateY(180deg)}
.face-top{
  display:flex;align-items:center;justify-content:space-between;gap:14px;
  background:linear-gradient(90deg,#fff3e0,#fffaf3);padding:14px 20px;border-bottom:2px solid #ffe0b2
}
.side-label{font-size:clamp(18px,2.2vw,28px);font-weight:1000;color:#ef6c00}
.no{font-size:clamp(18px,2vw,25px);font-weight:900;color:#a34e00}
.content{flex:1;position:relative;display:flex;align-items:center;justify-content:center;padding:50px 210px 70px 50px}
.question-wrap{text-align:center;width:100%}
.kicker{font-size:clamp(18px,2.2vw,28px);font-weight:900;color:#bd5a00;margin-bottom:24px}
.jp{font-size:clamp(44px,7.6vw,86px);line-height:1.2;font-weight:1000;letter-spacing:.02em}
.prompt{margin-top:28px;font-size:clamp(18px,2.2vw,28px);font-weight:800;color:#7a4a2a}
.answer-grid{width:100%;display:grid;gap:18px}
.answer-row{
  display:grid;grid-template-columns:minmax(125px,180px) 1fr;gap:20px;align-items:center;
  background:#fff9f2;border:2px solid #ffd4aa;border-radius:22px;padding:18px 24px
}
.answer-label{font-size:clamp(20px,2.5vw,31px);font-weight:1000;color:#d76500}
.answer-value{font-size:clamp(34px,5.3vw,62px);line-height:1.08;font-weight:1000;word-break:break-word}
.speak-btn{margin-left:10px;border:0;border-radius:999px;padding:9px 14px;background:linear-gradient(#66b86f,#3f8f58);color:#fff;box-shadow:0 4px 0 #2b6840;font-size:16px;font-weight:1000;white-space:nowrap}
.answer-main{display:flex;align-items:center;justify-content:space-between;gap:10px}
@media(max-width:720px){.answer-main{justify-content:center}.speak-btn{padding:7px 11px;font-size:14px}}
.mascot{
  position:absolute;right:20px;bottom:20px;width:clamp(145px,21vw,235px);max-height:48%;
  object-fit:contain;filter:drop-shadow(0 7px 8px rgba(78,45,8,.16));pointer-events:none
}
.hint{
  min-height:58px;display:flex;align-items:center;justify-content:center;padding:10px 18px;
  border-top:2px solid #ffe0b2;background:#fffaf5;color:#8c4b1a;font-weight:900;font-size:clamp(15px,1.8vw,22px)
}
.controls{
  display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;
  background:linear-gradient(135deg,#ff7a00,#ff9800);padding:14px;border-radius:24px;box-shadow:var(--shadow)
}
button{
  border:0;border-radius:16px;padding:14px 18px;background:white;color:#e56700;
  font-size:clamp(16px,2vw,23px);font-weight:1000;cursor:pointer;box-shadow:0 3px 10px rgba(90,45,0,.13)
}
button:active{transform:translateY(1px)}
.brand{text-align:center;color:white;font-weight:1000;font-size:clamp(15px,2vw,24px);white-space:nowrap}
.brand strong{font-size:1.35em}
.tools{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.tool{background:#fff3e0;color:#9c4e00;border:2px solid #ffc06f;padding:9px 14px;font-size:15px}
.progress-wrap{height:11px;background:#ffe7ca;border-radius:999px;overflow:hidden}
.progress{height:100%;width:1%;background:linear-gradient(90deg,#ff9800,#ff6d00);transition:width .25s}
.footer{text-align:center;color:#895326;font-weight:800;font-size:14px;padding-bottom:4px}
@media(max-width:720px){
 body{padding:8px}
 .app{min-height:calc(100vh - 16px);gap:8px}
 .header{padding:10px 12px;border-radius:18px;grid-template-columns:auto 1fr auto;gap:8px}
 .badge,.counter{padding:7px 9px;border-radius:12px;font-size:13px}
 .title{font-size:18px;line-height:1.15}
 .card{height:calc(100vh - 230px);min-height:500px}
 .face{border-width:3px;border-radius:24px}
 .face-top{padding:10px 14px}
 .content{padding:32px 22px 150px}
 .jp{font-size:clamp(38px,11vw,62px)}
 .prompt{font-size:18px}
 .mascot{right:10px;bottom:8px;width:145px;max-height:155px}
 .answer-grid{gap:12px}
 .answer-row{grid-template-columns:1fr;padding:12px 16px;gap:4px;text-align:center}
 .answer-label{font-size:18px}
 .answer-value{font-size:clamp(30px,8vw,48px)}
 .controls{grid-template-columns:1fr 1fr;padding:8px;border-radius:18px}
 .brand{grid-column:1/-1;grid-row:1;font-size:15px}
 button{padding:11px 8px;font-size:16px}
 .tools{display:none}
 .hint{font-size:14px;min-height:46px}
}
</style>

<style id="mugen-top-back-style">
#mugenTopBack{
  position:fixed; left:12px; bottom:12px; z-index:99999;
  display:inline-flex; align-items:center; gap:6px;
  padding:10px 14px; border-radius:999px;
  background:#1f2937; color:#fff; text-decoration:none;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Yu Gothic",Meiryo,sans-serif;
  font-size:14px; font-weight:900;
  box-shadow:0 6px 18px rgba(0,0,0,.22);
}
#mugenTopBack:active{transform:translateY(1px)}
</style>

</head>

const card = document.getElementById('card');
const jp = document.getElementById('jp');
const base = document.getElementById('base');
const past = document.getElementById('past');
const pp = document.getElementById('pp');
const now = document.getElementById('now');
const frontNo = document.getElementById('frontNo');
const backNo = document.getElementById('backNo');
const progress = document.getElementById('progress');
const sideBadge = document.getElementById('sideBadge');


function speakText(text, form) {
  if (!('speechSynthesis' in window)) {
    alert('この端末では音声読み上げに対応していません。');
    return;
  }
  const c = cards[i];
  let spoken = text;
  if (c.base === 'read' && (form === 'past' || form === 'pp')) spoken = 'red';
  // "A / B" は両方を自然に読ませる
  spoken = spoken.replace(/\s*\/\s*/g, ', ');
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(spoken);
  u.lang = 'en-US';
  u.rate = 0.82;
  u.pitch = 1;
  speechSynthesis.speak(u);
}
function speakForm(form) {
  const c = cards[i];
  speakText(c[form], form);
}

function render() {
  const c = cards[i];
  jp.textContent = c.jp;
  base.textContent = c.base;
  past.textContent = c.past;
  pp.textContent = c.pp;
  now.textContent = i + 1;
  frontNo.textContent = 'No.' + c.no;
  backNo.textContent = 'No.' + c.no;
  progress.style.width = ((i + 1) / cards.length * 100) + '%';
  setFlip(false);
}

function setFlip(v) {
  flipped = v;
  card.classList.toggle('flipped', flipped);
  sideBadge.textContent = flipped ? '答え（裏）' : '問題（表）';
}
function next() { i = (i + 1) % cards.length; render(); }
function prev() { i = (i - 1 + cards.length) % cards.length; render(); }

card.addEventListener('click', () => setFlip(!flipped));
document.getElementById('next').addEventListener('click', next);
document.getElementById('prev').addEventListener('click', prev);
document.getElementById('reset').addEventListener('click', () => { cards=[...original]; i=0; render(); });
document.getElementById('shuffle').addEventListener('click', () => {
  for (let n=cards.length-1;n>0;n--) {
    const j=Math.floor(Math.random()*(n+1));
    [cards[n],cards[j]]=[cards[j],cards[n]];
  }
  i=0; render();
});

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') next();
  if (e.key === 'ArrowLeft') prev();
  if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); setFlip(!flipped); }
});

let sx=0, sy=0;
card.addEventListener('touchstart', e => {
  const t=e.changedTouches[0]; sx=t.clientX; sy=t.clientY;
}, {passive:true});
card.addEventListener('touchend', e => {
  const t=e.changedTouches[0];
  const dx=t.clientX-sx, dy=t.clientY-sy;
  if (Math.abs(dx)>55 && Math.abs(dx)>Math.abs(dy)*1.3) {
    if (dx<0) next(); else prev();
  }
}, {passive:true});

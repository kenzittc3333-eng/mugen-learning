<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>式の計算｜無限学習</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;background:#fffaf2;color:#7b4318}
header{background:#fff;border-bottom:5px solid #f28c18;padding:14px}
.brand{max-width:760px;margin:auto;font-size:clamp(22px,5vw,34px);font-weight:900}
main{max-width:760px;margin:auto;padding:38px 22px;text-align:center}
h1{margin:0 0 10px;color:#c96300;font-size:clamp(38px,9vw,62px)}
.sub{font-size:clamp(18px,4.5vw,27px);font-weight:800;margin-bottom:35px}
/* 社会の教材一覧と同じ2列・コンパクトなボタン配置 */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
.card{display:flex;min-width:0;min-height:162px;flex-direction:column;justify-content:center;align-items:center;text-decoration:none;background:#fff;border:3px solid #f3b45c;border-radius:22px;padding:16px 6px;color:#7b4318;box-shadow:0 7px 0 #f7d7a8;font-weight:900;text-align:center}
/* 各ボタンの幅に合わせ、文字の大きさを自動で最大化する */
.card strong,.card span{display:block;width:100%;max-width:100%;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:clip;letter-spacing:-.035em}
.card strong{color:#c96300;font-size:34px;line-height:1.3;margin-bottom:10px}
.card span{font-size:23px;line-height:1.35}
@media(max-width:400px){main{padding:28px 14px}.grid{gap:10px}.card{min-height:150px;border-radius:17px;padding:12px 4px}}
.card:first-child{background:linear-gradient(135deg,#ff9b18,#f47b00);color:#fff;border-color:#f28c18;box-shadow:0 10px 0 #c95e00}
.card:first-child strong{color:#fff}
.note{margin-top:35px;font-weight:700}
footer{text-align:center;padding:25px 10px;font-weight:800}
</style>
</head>
<body>
<header><div class="brand">♾️ 総合教育研究所　無限の可能性</div></header>
<main>
<h1>✏️ 式の計算</h1>
<div class="sub">学年を選んで学習しよう！</div>
<div class="grid">

<footer>♾️ 総合教育研究所　無限の可能性</footer>
<script>
/* 端末幅・文字数に応じて、各行を1行に保ったまま最大の字にする。 */
(() => {
  const labels = [...document.querySelectorAll('.grid .card strong, .grid .card span')];
  function fitMenuText() {
    labels.forEach(el => {
      const isTitle = el.tagName === 'STRONG';
      const upper = isTitle ? 34 : 23;
      const lower = 8;
      const width = el.clientWidth;
      if (!width) return;
      let low = lower, high = upper;
      el.style.fontSize = high + 'px';
      if (el.scrollWidth <= width) return;
      for (let n=0; n<13; n++) {
        const mid = (low + high) / 2;
        el.style.fontSize = mid + 'px';
        if (el.scrollWidth <= width) low = mid;
        else high = mid;
      }
      // Pixel rounding safety margin prevents clipping on narrow mobile displays.
      el.style.fontSize = Math.max(lower, low - 0.35).toFixed(2) + 'px';
    });
  }
  fitMenuText();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitMenuText);
  window.addEventListener('resize', fitMenuText, {passive:true});
})();
</script>
</body></html>

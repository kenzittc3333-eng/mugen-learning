<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;background:linear-gradient(#ff9418,#ffd16b);color:#5a2600;min-height:100vh}
header{text-align:center;padding:22px 12px 12px;background:linear-gradient(135deg,#ff8a00,#ffb52e);color:white}
.brand{display:inline-block;background:white;color:#df5c00;border-radius:28px;padding:10px 20px;font-weight:900;font-size:clamp(15px,4vw,21px);box-shadow:0 6px 0 #df7900}
.hero{position:relative;max-width:760px;margin:auto;padding:20px 10px 6px}
.hero h1{font-size:clamp(34px,9vw,62px);line-height:1.05;margin:0;font-weight:1000;text-shadow:0 3px 0 rgba(120,50,0,.2)}
.hero .grade{font-size:clamp(23px,6vw,38px);font-weight:900}
.badge{display:inline-block;margin-top:12px;background:#f05a00;border-radius:12px;padding:9px 16px;font-weight:900}
.heroMascot{position:absolute;left:2px;bottom:-10px;width:105px;z-index:20}
.heroMascot .mascot{width:100%;height:auto}
.controls{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:760px;margin:14px auto;padding:0 12px}
button{border:0;border-radius:20px;padding:16px 6px;font-size:clamp(16px,4vw,23px);font-weight:900;color:white;background:linear-gradient(#ff7600,#e95400);box-shadow:0 7px 0 #b74400;cursor:pointer}
button:active{transform:translateY(4px);box-shadow:0 3px 0 #b74400}
main{max-width:760px;margin:auto;padding:8px 14px 35px}
.card{position:relative;min-height:500px;background:#fffdf9;border:5px solid #ff7600;border-radius:42px;box-shadow:0 10px 0 rgba(177,75,0,.2);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:55px 25px 70px;overflow:hidden;touch-action:pan-y}
.num{position:absolute;left:24px;top:0;background:linear-gradient(#ff7c00,#e94e00);color:white;padding:22px 28px 28px;border-radius:0 0 35px 35px;font-size:26px;font-weight:900}
.label{background:#ff7600;color:white;border-radius:18px;padding:10px 26px;font-size:25px;font-weight:900;margin-bottom:35px}
.math{font-size:clamp(39px,10vw,72px);color:#2d160c;line-height:1.3;max-width:100%}
.answer{font-size:clamp(38px,9vw,68px);color:#f05a00;font-weight:900;line-height:1.35}
.hint{position:absolute;bottom:34px;font-size:clamp(14px,3.5vw,20px);font-weight:900;color:#df5c00}
.cardMascot{position:absolute;right:15px;bottom:8px;width:112px;z-index:20}
.cardMascot .mascot{width:100%;height:auto}
.counter{margin-top:28px;background:#fff8ef;border-radius:28px;text-align:center;padding:20px;font-size:32px;font-weight:1000;color:#d84f00}
footer{text-align:center;padding:22px;font-weight:900;color:#713100}
@media(max-width:520px){
 .controls{gap:7px} button{padding:14px 3px;font-size:15px}
 .card{min-height:440px;padding-left:14px;padding-right:14px}
 .heroMascot{width:86px} .cardMascot{width:92px}
}
</style>

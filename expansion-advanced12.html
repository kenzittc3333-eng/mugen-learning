<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ff9100">
<title>中学3年 発展式の展開12問｜MUGEN学習LAB</title>
<meta name="description" content="中学3年 発展式の展開12問。写真の問題を12問すべて収録したフラッシュカード。">
<style>
:root{--o:#f88300;--d:#874000;--a:#d03717}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;color:#372016;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;background:linear-gradient(180deg,#ffa92e,#ffda87 30%,#fff9f0 100%)}
header{padding:12px 10px;background:linear-gradient(130deg,#ff7800,#ffb838);border-bottom:4px solid #fff4bd;text-align:center;box-shadow:0 5px 15px #93430030}
.head{position:relative;max-width:940px;margin:auto;min-height:151px;display:flex;align-items:center;justify-content:center;border-radius:24px;background:radial-gradient(ellipse at center,#ffe5ab88,transparent 73%)}
.head img{position:absolute;bottom:0;left:0;width:clamp(78px,20vw,147px);height:140px;object-fit:contain;filter:drop-shadow(0 4px 4px #76330066)}
.title{padding-left:clamp(75px,18vw,158px);width:100%}
.brand{display:inline-block;max-width:100%;font-weight:900;font-size:clamp(11px,2.9vw,18px);color:#ba4e00;background:#fff9f0;border-radius:25px;padding:6px 12px;white-space:nowrap}
h1{margin:9px 0 3px;font-size:clamp(26px,6vw,48px);line-height:1.17;color:white;text-shadow:0 4px #a34400,0 6px 14px #87340044}
.tagline{font-weight:900;color:#7b3500;font-size:clamp(11px,3vw,17px)}
main{max-width:920px;margin:auto;padding:15px 10px 27px}
.controls{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:15px}
button{min-height:48px;border:0;border-radius:15px;color:#fff;font:900 clamp(12px,2.6vw,18px) inherit;background:linear-gradient(#ffa415,#f06a00);box-shadow:0 4px #ac4900;cursor:pointer}
button:active{transform:translateY(3px);box-shadow:0 1px #ac4900}
button:focus-visible,.card:focus-visible{outline:3px solid #3178db;outline-offset:3px}
.card{position:relative;width:100%;min-height:clamp(390px,66vw,540px);border:3px solid #ff8000;border-radius:26px;background:linear-gradient(155deg,#fff,#fff9ed);box-shadow:0 13px 27px #9a48003b,inset 0 0 0 7px #fff1d7;padding:80px 15px 110px;display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;user-select:none;touch-action:pan-y}
.number{position:absolute;top:0;left:16px;padding:11px 18px 15px;border-radius:0 0 25px 25px;color:white;font-size:19px;font-weight:900;background:linear-gradient(#ff9f14,#ed5900)}
.side{position:absolute;top:17px;right:15px;padding:8px 22px;border-radius:22px;background:#ff8b00;color:white;font-size:20px;font-weight:900}
.card.answer .side{background:#cd4016}
.center{width:100%;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:21px;z-index:2;position:relative}
.prompt{font-size:clamp(17px,4.6vw,29px);font-weight:900;color:#934600;text-align:center}
.formulas{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;width:100%}
.formula{font-family:"Cambria Math","STIX Two Math","Times New Roman",serif;font-size:clamp(28px,6.4vw,62px);line-height:1.35;text-align:center;white-space:nowrap;letter-spacing:-.035em;max-width:100%}
.formula.long{font-size:clamp(21px,4.5vw,43px)}
.formula i{font-family:inherit;font-style:italic}
.formula sup{font-size:.61em;vertical-align:super;line-height:0}
.answer .formula{color:#d13415}
.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.82em;line-height:1.05;margin:0 .08em;transform:translateY(-.05em)}
.frac>span{display:block;padding:0 .18em}
.frac>span:first-child{border-bottom:2px solid currentColor}
.mas{position:absolute;bottom:10px;right:5px;display:flex;align-items:end;z-index:1;pointer-events:none}
.mas img{width:clamp(62px,13vw,107px);height:clamp(65px,14vw,110px);object-fit:contain}
.hint{position:absolute;bottom:14px;left:13px;font-size:clamp(10px,2.5vw,14px);color:#b65e00;font-weight:900;max-width:calc(100% - 160px)}
.progress{max-width:650px;margin:17px auto;padding:12px 16px;background:#fff9ec;border:2px solid #ffd18a;border-radius:20px}
.ptop{display:flex;justify-content:space-between;margin-bottom:9px;font-weight:900;color:#a24b00;font-size:19px}
.bar{height:13px;background:white;border:1px solid #ecc78b;border-radius:30px;overflow:hidden}
.fill{width:8.333%;height:100%;background:linear-gradient(90deg,#ffd04b,#fa7900);transition:width .25s}
footer{text-align:center;color:#9c510e;font-size:13px;font-weight:800;margin-top:19px}
@media(max-width:500px){
header{padding:7px}.head{min-height:122px}.head img{width:90px;height:120px;left:-4px}.title{padding-left:88px}.brand{font-size:10px;padding:6px 7px}h1{font-size:clamp(22px,6.3vw,32px)}
main{padding:12px 7px 27px}.controls{gap:5px}.controls button{font-size:12px;min-height:45px;border-radius:12px}
.card{min-height:440px;padding:76px 7px 104px}.number{font-size:16px;left:10px;padding:10px 14px}.side{font-size:16px;padding:7px 17px;top:15px;right:10px}
.center{gap:25px}.prompt{font-size:clamp(16px,4.4vw,21px)}.formula{font-size:clamp(26px,7.2vw,38px)}.formula.long{font-size:clamp(19px,5.1vw,27px)}.mas img{width:75px;height:90px}.hint{max-width:calc(100% - 130px)}
}
@media(max-width:360px){.formula.long{font-size:18px}.mas img{width:63px;height:78px}.hint{max-width:calc(100% - 110px)}}
</style>
</head>
<body>
<header><div class="head">
<img src="factorization-nankou.png" alt="なんこうくん">
<div class="title"><div class="brand">♾️ 総合教育研究所　無限の可能性</div>
<h1>中学3年<br>発展式の展開12問</h1>
<div class="tagline">★ MUGEN学習LAB フラッシュカード ★</div></div></div></header>
<main>
<nav class="controls" aria-label="フラッシュカード操作">
<button type="button" id="prev">◀ 前へ</button>
<button type="button" id="flip">表／裏</button>
<button type="button" id="next">次へ ▶</button>
<button type="button" id="shuffle">🔀 シャッフル</button>
</nav>
<section id="card" class="card" role="button" tabindex="0" aria-label="問題のカード、タップすると解答">
<div id="number" class="number">問題 1</div><div id="side" class="side">表</div>
<div class="center"><div id="prompt" class="prompt">※次の式を展開しなさい※</div><div id="formulas" class="formulas"></div></div>
<div class="mas"><img src="factorization-nankou.png" alt=""><img src="factorization-chappy.png" alt=""></div>
<div class="hint">タップで解答　左スワイプで次へ　右スワイプで前へ</div>
</section>
<div class="progress"><div class="ptop"><span>学習の進み具合</span><span id="progressText">1 / 12</span></div><div class="bar"><div class="fill" id="fill"></div></div></div>
<footer>総合教育研究所　無限の可能性｜なんこうくん＆むげんチャッピー</footer>
</main>
<script>
"use strict";
// ノートの①〜⑫をすべて収録。②のみ除法のため問題文を「計算しなさい」とする。
const origin=[
{q:["−4x(x−3y−2)"],a:["−4x²+12xy+8x"]},
{q:["(8xy²−4xy)÷(4/3xy)"],a:["6y−3"],calc:true},
{q:["(3x−1)(3x+6)"],a:["9x²+15x−6"]},
{q:["(−x+1)(−x−3)"],a:["x²+2x−3"]},
{q:["(x+y+6)(x+y−6)"],a:["x²+2xy+y²−36"]},
{q:["(x−3y+2)(x−3y−2)"],a:["x²−6xy+9y²−4"]},
{q:["(3x−2y−1)(3x−2y−5)"],a:["9x²−12xy+4y²","−18x+12y+5"]},
{q:["(x+y+1)²"],a:["x²+2xy+y²"," +2x+2y+1"]},
{q:["(2x−y−3)²"],a:["4x²−4xy+y²","−12x+6y+9"]},
{q:["(x+y+3)(x+y−3)"],a:["x²+2xy+y²−9"]},
{q:["(x+y+6)(x−y+6)"],a:["x²−y²+12x+36"]},
{q:["(x+y+5)(x−y−5)"],a:["x²−y²−10y−25"]}
].map((c,i)=>({...c,no:i+1}));
let cards=origin.slice(),index=0,back=false;
const el=id=>document.getElementById(id);
let touchX=0,touchY=0,swipeUntil=0;
function fmt(s){
return s.replace(/4\/3/g,'<span class="frac"><span>4</span><span>3</span></span>')
.replace(/[xy]/g,t=>'<i>'+t+'</i>')
.replace(/²/g,'<sup>2</sup>');
}
function render(){
const c=cards[index],lines=back?c.a:c.q;
el('card').classList.toggle('answer',back);
el('number').textContent='問題 '+c.no;
el('side').textContent=back?'裏':'表';
el('prompt').textContent=back?'答え':(c.calc?'※次の式を計算しなさい※':'※次の式を展開しなさい※');
el('formulas').replaceChildren();
lines.forEach(s=>{const d=document.createElement('div');d.className='formula'+(s.length>21?' long':'');d.innerHTML=fmt(s);el('formulas').append(d);});
el('progressText').textContent=(index+1)+' / '+cards.length;
el('fill').style.width=((index+1)/cards.length*100)+'%';
el('card').setAttribute('aria-label','問題'+c.no+(back?'の解答':'')+'。タップして表裏を切り替える');
}
function flip(){back=!back;render()}
function next(){index=(index+1)%cards.length;back=false;render()}
function prev(){index=(index-1+cards.length)%cards.length;back=false;render()}
function shuffle(){for(let i=cards.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[cards[i],cards[j]]=[cards[j],cards[i]];}index=0;back=false;render()}
el('flip').onclick=flip;el('prev').onclick=prev;el('next').onclick=next;el('shuffle').onclick=shuffle;
el('card').addEventListener('click',()=>{if(Date.now()<swipeUntil)return;flip()});
el('card').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();flip()}});
document.addEventListener('keydown',e=>{if(['INPUT','BUTTON','SELECT'].includes(document.activeElement?.tagName))return;if(e.key==='ArrowRight')next();if(e.key==='ArrowLeft')prev();});
el('card').addEventListener('touchstart',e=>{if(e.touches.length===1){touchX=e.touches[0].clientX;touchY=e.touches[0].clientY}},{passive:true});
el('card').addEventListener('touchend',e=>{if(e.changedTouches.length!==1)return;let dx=e.changedTouches[0].clientX-touchX,dy=e.changedTouches[0].clientY-touchY;if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.2){swipeUntil=Date.now()+450;if(dx<0)next();else prev()}},{passive:true});
render();
</script></body></html>
